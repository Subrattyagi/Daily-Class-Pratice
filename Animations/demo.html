<!DOCTYPE html>
<html>
<title>Bootstrap and Tailwind CSS</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="https://www.w3schools.com/w3css/6/w3.css">
<body class="w3-container">

<h1>Explore Cities</h1>
<p>Discover three great European destinations.</p>

<div class="w3-grid" style="grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px">

<div class="w3-container w3-card">
    <h2>London</h2>
    <p>Explore one of the world's great cities.</p>
    <p><button class="w3-button w3-black">Explore</button></p>
</div>

<div class="w3-container w3-card">
  <h2>Paris</h2>
  <p>Discover art, food, and architecture.</p>
  <p><button class="w3-button w3-black">Explore</button></p>
</div>

<div class="w3-container w3-card">
  <h2>Rome</h2>
  <p>Experience thousands of years of history.</p>
  <p><button class="w3-button w3-black">Explore</button></p>
</div>

</div>

</body>
</html>
